<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500">
  <defs>
    <linearGradient id="hero-grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Decorative Rings -->
  <circle cx="340" cy="250" r="210" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.25"/>
  <circle cx="340" cy="250" r="160" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.3"/>

  <!-- Center Card: Service Operations Hub -->
  <rect x="130" y="70" width="400" height="350" rx="20" fill="url(#hero-grad-card)" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Header Bar inside card -->
  <rect x="130" y="70" width="400" height="56" rx="20" fill="#0f172a"/>
  <circle cx="160" cy="98" r="6" fill="#ef4444"/>
  <circle cx="178" cy="98" r="6" fill="#f59e0b"/>
  <circle cx="196" cy="98" r="6" fill="#10b981"/>
  <text x="330" y="103" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">HOUSE MAINTENANCE UAE</text>

  <!-- Central House Outline with Cross Tools -->
  <g transform="translate(330, 230)">
    <!-- House Silhouette -->
    <path d="M-90 10 L0 -70 L90 10 L70 10 L70 80 L-70 80 L-70 10 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-25 80 L-25 35 L25 35 L25 80 Z" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="15" cy="58" r="3" fill="#f59e0b"/>
    <!-- Window with Glow -->
    <rect x="-55" y="0" width="28" height="28" rx="4" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="2"/>
    <rect x="27" y="0" width="28" height="28" rx="4" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <!-- Floating Badge 1: 15 Years Experience -->
  <g transform="translate(50, 140)" filter="url(#shadow)">
    <rect width="180" height="74" rx="14" fill="#0f1f38" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="38" cy="37" r="20" fill="#0284c7" fill-opacity="0.2"/>
    <text x="38" y="43" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="middle">15+</text>
    <text x="70" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Years Experience</text>
    <text x="70" y="49" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Trusted in UAE</text>
  </g>

  <!-- Floating Badge 2: 24/7 Rapid Emergency -->
  <g transform="translate(420, 110)" filter="url(#shadow)">
    <rect width="180" height="74" rx="14" fill="#1c1917" stroke="#e11d48" stroke-width="1.5"/>
    <circle cx="36" cy="37" r="18" fill="#be123c" fill-opacity="0.2"/>
    <circle cx="36" cy="37" r="6" fill="#e11d48"/>
    <text x="68" y="31" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">24/7 Emergency</text>
    <text x="68" y="48" fill="#fda4af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Available Non-Stop</text>
  </g>

  <!-- Floating Badge 3: 3 Emirates Service Areas -->
  <g transform="translate(40, 310)" filter="url(#shadow)">
    <rect width="200" height="78" rx="14" fill="#0f1f38" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="38" cy="39" r="20" fill="#d97706" fill-opacity="0.2"/>
    <!-- UAE Location Pin -->
    <path d="M38 27 c-4.5 0 -8 3.5 -8 8 c0 6 8 13 8 13 s8 -7 8 -13 c0 -4.5 -3.5 -8 -8 -8 z" fill="#f59e0b"/>
    <circle cx="38" cy="35" r="2.8" fill="#0f1f38"/>
    <text x="70" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">3 Emirates Covered</text>
    <text x="70" y="50" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Ajman • Sharjah • UAQ</text>
  </g>

  <!-- Floating Badge 4: 100% Service Guarantee -->
  <g transform="translate(420, 310)" filter="url(#shadow)">
    <rect width="185" height="78" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="38" cy="39" r="20" fill="#047857" fill-opacity="0.4"/>
    <path d="M30 39 l5 5 l11 -11" stroke="#34d399" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="70" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">100% Guarantee</text>
    <text x="70" y="50" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Quality Workmanship</text>
  </g>
</svg>
