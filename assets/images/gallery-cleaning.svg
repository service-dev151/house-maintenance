  <rect x="40" y="325" width="180" height="38" rx="8" fill="#0891b2" fill-opacity="0.9"/>
  <text x="55" y="349" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">CLEANING WORK</text>
  <text x="560" y="349" text-anchor="end" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Service Category Showcase</text>
