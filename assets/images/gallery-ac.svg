<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg-ac" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2d48"/>
      <stop offset="100%" stop-color="#145da0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg-ac)"/>
  <!-- Wall Split AC Unit Illustration -->
  <g transform="translate(300, 160)">
    <!-- Main AC Body -->
    <rect x="-140" y="-55" width="280" height="95" rx="10" fill="#0f3e6d" stroke="#7dd3fc" stroke-width="4"/>
    <!-- Louver / Air Vent -->
    <rect x="-120" y="15" width="240" height="15" rx="4" fill="#0c2d48" stroke="#38bdf8" stroke-width="2"/>
    <!-- Digital Display -->
    <rect x="70" y="-35" width="45" height="22" rx="4" fill="#082032"/>
    <text x="92" y="-19" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">21°C</text>
    <circle cx="55" cy="-24" r="3" fill="#10b981"/>
    <!-- Air Flow Waves (Cold Air) -->
    <path d="M-90 45 C-70 75, -50 75, -30 110" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M-30 45 C-10 75, 10 75, 30 110" fill="none" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <path d="M30 45 C50 75, 70 75, 90 110" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <!-- Snowflake Badge -->
    <circle cx="-95" cy="-24" r="16" fill="#082032" stroke="#38bdf8" stroke-width="2"/>
    <path d="M-95 -32 L-95 -16 M-103 -24 L-87 -24" stroke="#7dd3fc" stroke-width="2"/>
  </g>
  <rect x="40" y="325" width="180" height="38" rx="8" fill="#0284c7" fill-opacity="0.9"/>
  <text x="55" y="349" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">AC SERVICES</text>
  <text x="560" y="349" text-anchor="end" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Service Category Showcase</text>
</svg>
