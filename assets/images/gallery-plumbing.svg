<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg-plumb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#164e63"/>
    </linearGradient>
    <linearGradient id="accent-plumb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg-plumb)"/>
  <circle cx="500" cy="80" r="180" fill="#38bdf8" fill-opacity="0.05"/>
  <circle cx="80" cy="320" r="140" fill="#0284c7" fill-opacity="0.08"/>
  <g opacity="0.12" stroke="#ffffff" stroke-width="1.5">
    <line x1="0" y1="50" x2="600" y2="50"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="250" x2="600" y2="250"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="350" x2="600" y2="350"/>
    <line x1="50" y1="0" x2="50" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/>
    <line x1="350" y1="0" x2="350" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="550" y1="0" x2="550" y2="400"/>
  </g>
  <!-- Main Illustration: Plumbing Pipes & Valves -->
  <g transform="translate(300, 175)" text-anchor="middle">
    <!-- Pipe Network -->
    <path d="M-120 40 L-20 40 L-20 -40 L60 -40 L60 20 L130 20" fill="none" stroke="#7dd3fc" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Pressure gauge -->
    <circle cx="-20" cy="-40" r="28" fill="#0c4a6e" stroke="#38bdf8" stroke-width="4"/>
    <path d="M-20 -40 L-10 -55" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-20" cy="-40" r="5" fill="#f59e0b"/>
    <!-- Valve wheel -->
    <circle cx="60" cy="20" r="20" fill="#0c4a6e" stroke="#38bdf8" stroke-width="3"/>
    <line x1="40" y1="20" x2="80" y2="20" stroke="#38bdf8" stroke-width="3"/>
    <line x1="60" y1="0" x2="60" y2="40" stroke="#38bdf8" stroke-width="3"/>
    <!-- Water Drop -->
    <path d="M130 20 C130 10, 145 25, 145 35 C145 42, 138 48, 130 48 C122 48, 115 42, 115 35 C115 25, 130 10, 130 20 Z" fill="#38bdf8"/>
  </g>
  <!-- Category Badge -->
  <rect x="40" y="325" width="165" height="38" rx="8" fill="#0284c7" fill-opacity="0.9"/>
  <text x="55" y="349" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">PLUMBING WORK</text>
  <!-- Tagline -->
  <text x="560" y="349" text-anchor="end" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Service Category Showcase</text>
</svg>
