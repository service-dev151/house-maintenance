<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg-paint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="wall-paint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg-paint)"/>
  <!-- Painted Wall Texture Swipe -->
  <path d="M120 70 C240 50, 360 80, 480 60 L460 210 C340 230, 220 190, 100 220 Z" fill="url(#wall-paint)" fill-opacity="0.3"/>
  <!-- Paint Roller in Action -->
  <g transform="translate(300, 160)">
    <rect x="-70" y="-30" width="140" height="45" rx="8" fill="#a855f7" stroke="#e9d5ff" stroke-width="3"/>
    <path d="M-60 -7.5 h120" stroke="#f3e8ff" stroke-width="3" stroke-dasharray="8 8"/>
    <!-- Handle -->
    <path d="M70 -7.5 L95 -7.5 L95 45 L0 45 L0 100" fill="none" stroke="#e9d5ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-8" y="100" width="16" height="45" rx="4" fill="#fbbf24"/>
    <!-- Drops of fresh paint -->
    <circle cx="-30" cy="30" r="5" fill="#c084fc"/>
    <circle cx="20" cy="40" r="4" fill="#c084fc"/>
    <circle cx="60" cy="20" r="6" fill="#c084fc"/>
  </g>
  <rect x="40" y="325" width="175" height="38" rx="8" fill="#7c3aed" fill-opacity="0.9"/>
  <text x="55" y="349" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">PAINTING WORK</text>
  <text x="560" y="349" text-anchor="end" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Service Category Showcase</text>
</svg>
