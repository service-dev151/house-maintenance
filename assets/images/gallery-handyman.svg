<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg-handy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg-handy)"/>
  <!-- Toolbox & crossed tools illustration -->
  <g transform="translate(300, 170)">
    <!-- Heavy-Duty Toolbox Base -->
    <rect x="-110" y="0" width="220" height="90" rx="8" fill="#312e81" stroke="#818cf8" stroke-width="4"/>
    <rect x="-90" y="20" width="180" height="12" rx="2" fill="#4338ca"/>
    <rect x="-15" y="35" width="30" height="20" rx="4" fill="#f59e0b"/>
    <!-- Handle -->
    <path d="M-40 0 L-40 -35 L40 -35 L40 0" fill="none" stroke="#a5b4fc" stroke-width="7" stroke-linecap="round"/>
    <!-- Crossed Wrench and Hammer -->
    <g transform="translate(0, -45)">
      <!-- Hammer -->
      <path d="M-60 -20 L-40 -40 L-25 -25 L-45 -5" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
      <line x1="-35" y1="-15" x2="35" y2="55" stroke="#e0e7ff" stroke-width="8" stroke-linecap="round"/>
      <!-- Wrench -->
      <line x1="35" y1="-15" x2="-35" y2="55" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
      <circle cx="45" cy="-25" r="16" fill="none" stroke="#94a3b8" stroke-width="6"/>
      <rect x="42" y="-35" width="8" height="12" fill="#1e1b4b"/>
    </g>
  </g>
  <rect x="40" y="325" width="185" height="38" rx="8" fill="#4f46e5" fill-opacity="0.9"/>
  <text x="55" y="349" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">HANDYMAN WORK</text>
  <text x="560" y="349" text-anchor="end" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Service Category Showcase</text>
</svg>
