<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg-roof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg-roof)"/>
  <!-- Roof structure illustration -->
  <g transform="translate(300, 175)">
    <!-- Main Triangular Roof Truss -->
    <polygon points="0,-90 -160,50 160,50" fill="#9a3412" stroke="#fdba74" stroke-width="4"/>
    <!-- Roof Tile Patterns -->
    <path d="M-120 15 L120 15 M-80 -20 L80 -20 M-40 -55 L40 -55" stroke="#ea580c" stroke-width="4"/>
    <!-- Vertical supports -->
    <line x1="0" y1="-90" x2="0" y2="50" stroke="#fed7aa" stroke-width="3"/>
    <line x1="-80" y1="-20" x2="0" y2="50" stroke="#fed7aa" stroke-width="2"/>
    <line x1="80" y1="-20" x2="0" y2="50" stroke="#fed7aa" stroke-width="2"/>
    <!-- Gutter and weather seal -->
    <path d="M-175 55 L175 55 L175 65 L-175 65 Z" fill="#fdba74"/>
    <!-- Water protection shield badge -->
    <circle cx="0" cy="0" r="32" fill="#431407" stroke="#f97316" stroke-width="3"/>
    <path d="M-10 -10 L0 -20 L10 -10 L10 10 C10 16 0 20 0 20 C0 20 -10 16 -10 10 Z" fill="#f97316"/>
  </g>
  <rect x="40" y="325" width="170" height="38" rx="8" fill="#ea580c" fill-opacity="0.9"/>
  <text x="55" y="349" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">ROOFING WORK</text>
  <text x="560" y="349" text-anchor="end" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Service Category Showcase</text>
</svg>
