<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg-appliance" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg-appliance)"/>
  <!-- Washing machine / refrigerator diagnostic illustration -->
  <g transform="translate(300, 165)">
    <!-- Washing Machine Body -->
    <rect x="-85" y="-75" width="170" height="170" rx="14" fill="#065f46" stroke="#6ee7b7" stroke-width="4"/>
    <line x1="-85" y1="-25" x2="85" y2="-25" stroke="#34d399" stroke-width="3"/>
    <!-- Controls -->
    <circle cx="-50" cy="-50" r="10" fill="#f59e0b"/>
    <rect x="-20" y="-55" width="40" height="10" rx="3" fill="#10b981"/>
    <circle cx="50" cy="-50" r="4" fill="#a7f3d0"/>
    <circle cx="62" cy="-50" r="4" fill="#a7f3d0"/>
    <!-- Glass Door / Drum -->
    <circle cx="0" cy="40" r="48" fill="#022c22" stroke="#6ee7b7" stroke-width="4"/>
    <circle cx="0" cy="40" r="34" fill="#047857" fill-opacity="0.4" stroke="#a7f3d0" stroke-width="2" stroke-dasharray="6 6"/>
    <!-- Diagnostic wrench / spark -->
    <path d="M70 -10 L100 -40 L115 -25 L85 5 Z" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
  </g>
  <rect x="40" y="325" width="225" height="38" rx="8" fill="#059669" fill-opacity="0.9"/>
  <text x="55" y="349" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">APPLIANCE REPAIR</text>
  <text x="560" y="349" text-anchor="end" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Service Category Showcase</text>
</svg>
